<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Crown cross top -->
  <rect x="29" y="4" width="6" height="10" rx="1" fill="#F0D9B5"/>
  <rect x="25" y="8" width="14" height="6" rx="1" fill="#F0D9B5"/>
  <!-- Crown head -->
  <rect x="20" y="14" width="24" height="6" rx="2" fill="#F0D9B5"/>
  <!-- Crown body trapezoid -->
  <polygon points="18,20 46,20 42,44 22,44" fill="#F0D9B5"/>
  <!-- Base top bar -->
  <rect x="16" y="44" width="32" height="5" rx="2" fill="#D4B896"/>
  <!-- Base bottom bar -->
  <rect x="13" y="49" width="38" height="8" rx="3" fill="#D4B896"/>
  <!-- Crown detail lines -->
  <line x1="24" y1="20" x2="22" y2="44" stroke="#B58863" stroke-width="1.2" opacity="0.5"/>
  <line x1="32" y1="20" x2="32" y2="44" stroke="#B58863" stroke-width="1.2" opacity="0.5"/>
  <line x1="40" y1="20" x2="42" y2="44" stroke="#B58863" stroke-width="1.2" opacity="0.5"/>
  <!-- Outline -->
  <polygon points="18,20 46,20 42,44 22,44" fill="none" stroke="#8B6914" stroke-width="1.5"/>
  <rect x="20" y="14" width="24" height="6" rx="2" fill="none" stroke="#8B6914" stroke-width="1.5"/>
  <rect x="16" y="44" width="32" height="5" rx="2" fill="none" stroke="#8B6914" stroke-width="1.5"/>
  <rect x="13" y="49" width="38" height="8" rx="3" fill="none" stroke="#8B6914" stroke-width="1.5"/>
  <rect x="29" y="4" width="6" height="10" rx="1" fill="none" stroke="#8B6914" stroke-width="1.5"/>
  <rect x="25" y="8" width="14" height="6" rx="1" fill="none" stroke="#8B6914" stroke-width="1.5"/>
</svg>
